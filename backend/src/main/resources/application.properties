spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:scripto_db_mysql}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:scripto_user_mysql}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

server.port=${SERVER_PORT:${BACKEND_PORT:8080}}
spring.mvc.throw-exception-if-no-handler-found=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET}
scripto.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# Local model generated by scripto_v5_1_bilingual.ipynb
scripto.ai.local-enabled=${SCRIPTO_LOCAL_AI_ENABLED:true}
scripto.ai.model-path=${SCRIPTO_MODEL_PATH:./models/scripto-model-v3}

# NVIDIA Nemotron fallback.
scripto.nemotron.api-key=${NVIDIA_API_KEY}
scripto.nemotron.base-url=${NEMOTRON_BASE_URL:https://integrate.api.nvidia.com/v1/chat/completions}
scripto.nemotron.model=${NEMOTRON_MODEL:nvidia/nemotron-3-super-120b-a12b}
scripto.nemotron.connect-timeout-ms=${NEMOTRON_CONNECT_TIMEOUT_MS:5000}
scripto.nemotron.read-timeout-ms=${NEMOTRON_READ_TIMEOUT_MS:45000}
scripto.nemotron.max-attempts=${NEMOTRON_MAX_ATTEMPTS:2}

# PostgreSQL/pgvector retains the consented AI corpus. When enabled, a failed retention write invalidates the document submission.
scripto.vector.enabled=${PGVECTOR_ENABLED:true}
scripto.vector.url=${PGVECTOR_URL:jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}}
scripto.vector.username=${PG_USER:scripto_user_pg}
scripto.vector.password=${PG_PASSWORD}
scripto.vector.maximum-pool-size=${PG_MAX_POOL_SIZE:5}
scripto.vector.connection-timeout-ms=${PG_CONNECTION_TIMEOUT_MS:3000}


###############################################
# Swagger / OpenAPI
###############################################

# A interface personalizada está disponível em /docs.
# A interface padrão permanece em /swagger-ui.html como alternativa técnica.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.syntaxHighlight.activated=false
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.api-docs.path=/v3/api-docs
