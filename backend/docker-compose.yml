name: scripto

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_vector_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      SCRIPTO_MODEL_PATH: ${SCRIPTO_MODEL_PATH:-./models/scripto-model-v3}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NEMOTRON_CONNECT_TIMEOUT_MS: ${NEMOTRON_CONNECT_TIMEOUT_MS:-5000}
      NEMOTRON_READ_TIMEOUT_MS: ${NEMOTRON_READ_TIMEOUT_MS:-45000}
      NEMOTRON_MAX_ATTEMPTS: ${NEMOTRON_MAX_ATTEMPTS:-2}
      SCRIPTO_LOCAL_AI_ENABLED: ${SCRIPTO_LOCAL_AI_ENABLED:-true}
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED:-true}
      PGVECTOR_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-3000}
      PG_MAX_POOL_SIZE: ${PG_MAX_POOL_SIZE:-5}
      JAVA_OPTS: -Xms512m -Xmx1536m -XX:+ExitOnOutOfMemoryError
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - app
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"

volumes:
  mysql_data:
  postgres_vector_data_v2:
    name: scripto_postgres_vector_data_v2
